# Database
db.path=:memory:

# Scheduling
scheduler.jobs=test_jobs.yaml
scheduling.logs.dir=target/test-logs
scheduling.pool.size=4
scheduling.poll.interval.ms=5000

# Vault (same dev vault, isolated by path)
vault.address=http://127.0.0.1:8200
vault.secret.path=secret/my-scheduler/test
vault.managed=false
vault.data.dir=vault-data
vault.listener.address=127.0.0.1:8200
vault.tls.disable=true
vault.ui=false
vault.disable.mlock=true